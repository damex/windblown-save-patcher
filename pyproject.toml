[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "windblown-save-patcher"
version = "0.1.0"
description = "Patch Windblown save files to set reward flags, like demo Guinea Pig and early access Intern"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "damex"}]
keywords = ["windblown", "save-editor"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
]
requires-python = ">=3.12"
dependencies = ["pyyaml"]

[project.urls]
Repository = "https://github.com/damex/windblown-save-patcher"
Issues = "https://github.com/damex/windblown-save-patcher/issues"

[project.scripts]
windblown-save-patcher = "windblown_save_patcher.cli:main"

[tool.setuptools]
packages = ["windblown_save_patcher"]
